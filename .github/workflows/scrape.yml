name: scrape-registry

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "scripts/**"
      - "agents_master_registry.json"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin: 11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@v5 # pin: 42375524e23c412d94c57f1e014e1d2920f3a08
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - uses: actions/setup-node@v4 # pin: 1a4442cacd436585916779262731d5b162af4ff7a60
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Run scrapers
        run: |
          mkdir -p tmp
          for script in scripts/scrape_npm.py scripts/scrape_pypi.py scripts/scrape_vscode_marketplace.py scripts/scrape_github.py; do
            if [ -f "$script" ]; then python "$script" --out "tmp/$(basename $script .py).json" || echo '{"agents":{}}' > "tmp/$(basename $script .py).json"; else echo '{"agents":{}}' > "tmp/$(basename $script .py).json"; fi
          done
          ls -lh tmp/

      - name: Merge registry
        run: |
          if [ -f scripts/merge_registry.py ]; then python scripts/merge_registry.py --inputs tmp/*.json --output agents_master_registry.json --base agents_master_registry.json; else echo "skip merge, no script"; fi

      - name: Validate
        run: |
          python scripts/validate_registry.py --input agents_master_registry.json

      - name: Verify link injection dry-run
        run: |
          python3 << 'PY'
          import json, tempfile, pathlib, os, sys
          data=json.load(open('agents_master_registry.json'))
          agents=data.get('agents',{})
          print(f"verify: {len(agents)} agents cataloged")
          allowed={'standard_mcpServers','opencode_mcp','zed_context_servers'}
          for aid, meta in agents.items():
              assert meta.get('format') in allowed, f"{aid} bad format"
              assert 'paths' in meta and meta['paths'], f"{aid} no paths"
          tmp=pathlib.Path(tempfile.mktemp(suffix='.json'))
          tmp.write_text('{}')
          for aid, meta in list(agents.items())[:1]:
              j=json.loads(tmp.read_text())
              j.setdefault('mcpServers',{})['arbiter-gateway']={'command':'python','args':['-m','dictum_mcp.server']}
              tmp.write_text(json.dumps(j))
              assert 'arbiter-gateway' in json.loads(tmp.read_text())['mcpServers']
          print('dry-run inject OK for', aid)
          print('link dry-run verification PASSED')
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet agents_master_registry.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "dictum-bot"
          git config user.email "bot@dictum.local"
          DATE=$(date -u +%Y-%m-%d)
          git add agents_master_registry.json
          git commit -m "chore: registry update ${DATE}"
          git push

      - name: Tag version if bumped
        run: |
          VERSION=$(python -c "import json; print(json.load(open('agents_master_registry.json'))['version'])")
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            exit 0
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  test-link:
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt || true

      - name: Validate registry
        run: python scripts/validate_registry.py --input agents_master_registry.json

      - name: Test link dry-run (standalone)
        run: |
          python3 << 'PY'
          import json, pathlib
          data=json.load(open('agents_master_registry.json'))
          print(f"test-link: {len(data['agents'])} agents")
          agents=list(data['agents'].keys())
          assert agents==sorted(agents), f"agents not sorted {agents}"
          print('agents sorted OK')
          seen={}
          for aid, meta in data['agents'].items():
              for plat, tmpl in meta['paths'].items():
                  key=(plat,tmpl)
                  assert key not in seen, f"duplicate {key} in {aid} and {seen[key]}"
                  seen[key]=aid
          print('no duplicate paths OK')
          print('test-link job PASSED')
          PY
